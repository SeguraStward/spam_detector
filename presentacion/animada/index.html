<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detector de Spam — Presentación animada</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div id="app">
  <div id="progress"></div>
  <div class="chev l">&lsaquo;</div>
  <div class="chev r">&rsaquo;</div>

  <main id="stage"></main>

  <!-- Luchador de palitos (estilo Bruce Lee), bucle infinito, mira a la derecha -->
  <svg id="fighter" viewBox="0 0 120 150" aria-hidden="true">
    <g stroke="#0d0f12" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 0 -6; 0 0" dur="1.1s" repeatCount="indefinite"/>
        <!-- cabeza -->
        <circle cx="60" cy="22" r="11" fill="#fff"/>
        <!-- cinta en la cabeza (toque Bruce Lee) -->
        <path d="M50 17 q-12 -1 -18 6" stroke-width="3"/>
        <!-- torso -->
        <line x1="60" y1="33" x2="60" y2="86"/>
        <!-- brazo trasero -->
        <line x1="60" y1="47" x2="36" y2="66"/>
        <!-- brazo delantero (puñetazo) -->
        <line x1="60" y1="47" x2="94" y2="55">
          <animateTransform attributeName="transform" type="rotate"
            values="14 60 47; -40 60 47; 14 60 47" dur="0.7s" repeatCount="indefinite"/>
        </line>
        <!-- pierna trasera -->
        <line x1="60" y1="86" x2="43" y2="126"/>
        <!-- pierna delantera (patada) -->
        <line x1="60" y1="86" x2="82" y2="122">
          <animateTransform attributeName="transform" type="rotate"
            values="0 60 86; 0 60 86; 60 60 86; 0 60 86"
            keyTimes="0; 0.5; 0.72; 1" dur="1.8s" repeatCount="indefinite"/>
        </line>
      </g>
    </g>
  </svg>

  <!-- Palabra SPAM con serpiente que ondula, bucle infinito, mira a la izquierda -->
  <svg id="spam-snake" viewBox="0 0 360 130" aria-hidden="true">
    <g stroke="#0b5d2a" stroke-width="2">
      <!-- cuerpo de la serpiente (onda viajera) -->
      <circle cx="150" cy="84" r="6" fill="#15803d">
        <animate attributeName="cy" values="84;76;84;92;84" dur="0.9s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="132" cy="84" r="6.6" fill="#16a34a">
        <animate attributeName="cy" values="84;76;84;92;84" dur="0.9s" begin="-0.12s" repeatCount="indefinite"/></circle>
      <circle cx="114" cy="84" r="7.2" fill="#15803d">
        <animate attributeName="cy" values="84;76;84;92;84" dur="0.9s" begin="-0.24s" repeatCount="indefinite"/></circle>
      <circle cx="96" cy="84" r="7.8" fill="#16a34a">
        <animate attributeName="cy" values="84;76;84;92;84" dur="0.9s" begin="-0.36s" repeatCount="indefinite"/></circle>
      <circle cx="78" cy="84" r="8.4" fill="#15803d">
        <animate attributeName="cy" values="84;76;84;92;84" dur="0.9s" begin="-0.48s" repeatCount="indefinite"/></circle>
      <!-- cabeza (a la izquierda, mirando al luchador) -->
      <circle cx="56" cy="84" r="11" fill="#16a34a">
        <animate attributeName="cy" values="84;76;84;92;84" dur="0.9s" begin="-0.6s" repeatCount="indefinite"/></circle>
      <circle cx="50" cy="80" r="2.4" fill="#fff" stroke="none">
        <animate attributeName="cy" values="80;72;80;88;80" dur="0.9s" begin="-0.6s" repeatCount="indefinite"/></circle>
      <circle cx="50" cy="80" r="1.1" fill="#000" stroke="none">
        <animate attributeName="cy" values="80;72;80;88;80" dur="0.9s" begin="-0.6s" repeatCount="indefinite"/></circle>
      <!-- lengua bífida (parpadea) -->
      <path d="M45 84 l-12 0 m0 -3 l7 3 l-7 3" stroke="#b91c1c" stroke-width="2" fill="none">
        <animate attributeName="cy" values="0" dur="0.9s" begin="-0.6s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; -5 0; 0 0" dur="0.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.25;1" dur="0.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="178" y="101" font-family="Arial,Helvetica,sans-serif" font-size="50"
          font-weight="900" fill="#b91c1c" letter-spacing="2" stroke="none">SPAM</text>
  </svg>

  <div class="hint">Clic derecha (o &rarr;): avanzar &middot; sello ham/spam aleatorio &middot; clic izquierda (o &larr;): atr&aacute;s &middot; S: notas &middot; F: pantalla &middot; R: reiniciar</div>
  <div id="notes" class="hidden"></div>
</div>
<script src="assets/slides.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
